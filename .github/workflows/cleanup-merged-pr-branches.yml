name: Clean up merged PR branches

# Run only after a successful merge/push to the default branch.
# Manual dispatch defaults to a dry run for inspection.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview candidates without deleting branches
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: treatstory-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  clean:
    name: Delete unchanged branches from merged PRs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Safely clean merged PR head branches
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        with:
          script: |
            const { cleanMergedBranches } = require('./scripts/cleanup-merged-pr-branches.cjs');
            await cleanMergedBranches({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true',
            });
