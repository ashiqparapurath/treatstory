name: Verify TreatStory build

on:
  push:
    branches: [multi-vendor-foundation]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Update next-cloudinary dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/mobile-seller-catalog-checkout'
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet package-lock.json; then
            git add package-lock.json
            git commit -m "Lock Next.js 15 compatible Cloudinary SDK dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Firestore and Storage rules in the emulators
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,storage --project demo-treatstory --config firebase.json 'node -e "console.log(\"Rules emulator started successfully\")"'
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
