name: Verify TreatStory build

on:
  push:
    branches: [multi-vendor-foundation]
  pull_request:

# Only the newest commit on each pull request needs a full verification run.
# Earlier checks remain visible in GitHub's history but cannot block the head.
concurrency:
  group: treatstory-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate rules and execute real atomic-checkout Firestore emulator tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,storage --project demo-treatstory --config firebase.json 'npx --no-install tsx tests/atomic-checkout-emulator.ts'
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
