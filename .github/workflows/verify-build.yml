name: Verify TreatStory build

on:
  push:
    branches: [multi-vendor-foundation]
  pull_request:

# Only the newest commit on each pull request needs a full verification run.
# Earlier checks remain visible in GitHub's history but cannot block the head.
concurrency:
  group: treatstory-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Regression tests
        run: npm test
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate rules and execute real atomic-checkout Firestore emulator tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,storage --project demo-treatstory --config firebase.json 'npx --no-install tsx tests/atomic-checkout-emulator.ts && npx --no-install tsx tests/seller-product-rules.ts && npx --no-install tsx tests/seller-store-rules.ts && npx --no-install tsx tests/seller-product-server.ts && npx --no-install tsx tests/mail-emulator.ts'
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build

  encrypted-support:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Prepare a private local test messaging server
        run: |
          python3 -m venv work/matrix-venv
          work/matrix-venv/bin/pip install PyYAML==6.0.3
          work/matrix-venv/bin/python scripts/support-matrix/local-server.py
      - name: Check production deployment YAML, Python and secure defaults
        run: |
          python3 -m py_compile infra/support-matrix/configure.py infra/support-matrix/bootstrap_service.py infra/support-matrix/smoke.py
          mkdir -p infra/support-matrix/private/secrets
          cp infra/support-matrix/env.sample infra/support-matrix/.env
          printf 'compose-validation-only\n' > infra/support-matrix/private/secrets/postgres_password
          docker compose -f infra/support-matrix/compose.yaml config --quiet
          rm -rf infra/support-matrix/private infra/support-matrix/.env
      - name: Build application and test stylesheet
        run: npm run build
      - name: Verify encrypted support with real Synapse, Firebase emulators and Chromium
        env:
          SUPPORT_MATRIX_TEST_CONFIG: work/support-matrix-server/test-config.json
        run: npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project demo-treatstory --config firebase.audit.json 'npm run test:support-matrix'
